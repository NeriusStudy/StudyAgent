# config.example.toml
# 说明：请复制此文件并重命名为 config.toml，然后填入真实的 API Key。
# 注意：config.toml 已被加入 .gitignore，千万不要将其提交到 Git！

[llm]
base_url = "https://api.deepseek.com/v1"
api_key = "在这里填入你的-API-KEY"  # <--- 保持为空或填入占位符
model = "deepseek-chat"

[storage]
log_dir = "./logs"
db_url = "sqlite:///./agent.db"
memory_path = "./memory"