# config.example.toml
# 说明：请复制此文件并重命名为 config.toml，然后填入真实的 API Key。

[llm]
base_url = "https://api.deepseek.com/v1"
api_key = "在这里填入你的-API-KEY"
model = "deepseek-chat"

[agent]
strategy = "chat"
max_react_steps = 10

[storage]
log_dir = "./logs"
db_url = "sqlite:///./agent.db"
memory_path = "./memory"

# ============================================================
# 工具配置
# ============================================================

# 本地工具列表。name 对应 agentcore/tools/builtin/ 下的模块名。
[[tools.local_tools]]
name = "calculator"
enabled = true

# MCP Server 列表（示例：Everything 测试服务器）
# 取消注释即可启用
