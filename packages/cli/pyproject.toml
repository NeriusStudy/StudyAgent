[project]
name = "agentcli"
version = "0.1.0"
description = "Minimal CLI client for the Agent Server"
readme = "README.md"
authors = [
    { name = "California", email = "719170202@qq.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "tomli-w>=1.2.0",
    "typer>=0.27.3",
    "agentschema",
]

[tool.uv.sources]
agentschema = { workspace = true }

[project.scripts]
agentcli = "agentcli.main:app"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
